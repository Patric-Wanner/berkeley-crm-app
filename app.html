<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#303336">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Berkeley CRM</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <div class="header-logo" id="homeBtn" style="cursor:pointer;" title="Tillbaka till start">
      <img src="https://cdn.berkeleycompany.com/preset:sharp/resize:fit:1700:0:0/width:1700/quality:70/gravity:sm/plain/https://api.berkeleycompany.com/storage/berkeley/logo/berkeley-logo-symbol.png" alt="Berkeley">
      <h1>Berkeley CRM</h1>
    </div>
    <input type="text" id="search" placeholder="Sök kund...">
    <button class="hbtn" id="addCustBtn">+ Ny kund</button>
    <button class="hbtn" id="dashBtn">Dashboard</button>
    <button class="hbtn" id="routeBtn">Rutt</button>
    <button class="hbtn" id="exportBtn">Exportera</button>
    <button class="hbtn" data-role="admin" id="adminBtn" style="display:none;">Admin</button>
    <div class="header-spacer"></div>
    <span class="header-user" id="userName"></span>
    <button class="theme-btn" id="themeBtn" title="Byt ljust/mörkt läge">🌙</button>
    <button class="hbtn" id="logoutBtn">Logga ut</button>
  </div>

  <!-- ═══ MAIN LAYOUT ═══ -->
  <div class="main-wrap">

    <!-- Sidebar / Dashboard -->
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <h2>Dashboard</h2>
          <button class="sidebar-close-btn" id="sidebarCloseBtn" title="Stäng">&#x2715;</button>
        </div>
        <p style="font-size:11px;color:var(--bm);" id="dashDate"></p>
      </div>

      <div class="sidebar-scroll">
        <!-- Manager: salesperson filter -->
        <div class="sidebar-section" data-role="manager" style="display:none;">
          <h3>Säljare</h3>
          <div class="filter-row">
            <select id="spFilter" class="sp-filter-select"></select>
            <button class="filter-clear-btn" id="spFilterClear" title="Rensa" style="display:none;">&#x2715;</button>
          </div>
        </div>

        <!-- City filter (all roles) -->
        <div class="sidebar-section">
          <h3>Ort</h3>
          <div class="filter-row">
            <select id="cityFilter" class="sp-filter-select">
              <option value="all">Alla orter</option>
            </select>
            <button class="filter-clear-btn" id="cityFilterClear" title="Rensa" style="display:none;">&#x2715;</button>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Översikt</h3>
          <div class="stat-grid" id="statsGrid"></div>
          <!-- Expandable detail list -->
          <div id="statDetail" class="stat-detail" style="display:none;">
            <div class="stat-detail-header">
              <h4 id="statDetailTitle"></h4>
              <button class="filter-clear-btn" id="statDetailClose" title="Stäng">&#x2715;</button>
            </div>
            <input type="text" id="statDetailSearch" class="card-input" placeholder="Sök i listan...">
            <div id="statDetailList" class="stat-detail-list"></div>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Filter</h3>
          <div class="filter-bar" id="filterBar">
            <div class="filter-chip active" data-filter="all">Alla</div>
            <div class="filter-chip" data-filter="green"><span class="filter-dot" style="background:#2ECC71;"></span>0–30d</div>
            <div class="filter-chip" data-filter="yellow"><span class="filter-dot" style="background:#EAC435;"></span>31–59d</div>
            <div class="filter-chip" data-filter="orange"><span class="filter-dot" style="background:#E67E22;"></span>60–89d</div>
            <div class="filter-chip" data-filter="red"><span class="filter-dot" style="background:#E74C3C;"></span>90+d</div>
            <div class="filter-chip" data-filter="novisit"><span class="filter-dot" style="background:#EAC435;border:1px solid #ccc;"></span>Ej besökt</div>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Behöver besökas</h3>
          <div id="toplist"></div>
        </div>

        <!-- Planned visits -->
        <div class="sidebar-section">
          <h3>Planerade besök</h3>
          <div id="plannedVisits"></div>
        </div>

        <!-- Manager: comparison stats -->
        <div class="sidebar-section" data-role="manager" style="display:none;">
          <h3>Jämförelse</h3>
          <div id="comparisonTable"></div>
        </div>
      </div>
    </div>

    <!-- Sidebar backdrop (mobile: tap to close) -->
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Map area -->
    <div class="map-container">
      <div id="routeSummary" class="route-summary" style="display:none;"></div>
      <div id="map"></div>
    </div>
  </div>

  <!-- ═══ CUSTOMER CARD PANEL ═══ -->
  <div id="customerCard" class="customer-card-panel">
    <div class="card-header">
      <button class="card-close-btn" onclick="CRM.closeCard()">&#x2715;</button>
    </div>
    <div id="cardContent" class="card-body"></div>
  </div>
  <div id="cardOverlay" class="card-overlay" onclick="CRM.closeCard()"></div>

  <!-- ═══ ADD CUSTOMER MODAL ═══ -->
  <div id="addCustModal" class="modal-overlay">
    <div class="modal">
      <h3>Ny kund</h3>
      <label>Företagsnamn *</label>
      <input id="acName" type="text" placeholder="Företagsnamn">
      <label>Kundnummer</label>
      <input id="acNr" type="text" placeholder="Kundnummer">
      <label>Adress</label>
      <input id="acAddress" type="text" placeholder="Gatuadress">
      <label>Postnummer</label>
      <input id="acZip" type="text" placeholder="123 45">
      <label>Ort *</label>
      <input id="acCity" type="text" placeholder="Ort">
      <label>Status</label>
      <select id="acStatus">
        <option value="active">Aktiv</option>
        <option value="prospect">Prospekt</option>
        <option value="inactive">Inaktiv</option>
      </select>
      <label data-role="admin" style="display:none;">Tilldela säljare</label>
      <select id="acAssign" data-role="admin" style="display:none;"></select>
      <p id="acError" style="color:#c0392b;font-size:12px;display:none;"></p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="CRM.closeAddCustomer()">Avbryt</button>
        <button class="btn-save" onclick="CRM.saveNewCustomer()">Spara</button>
      </div>
    </div>
  </div>

  <!-- ═══ EDIT CUSTOMER MODAL ═══ -->
  <div id="editCustModal" class="modal-overlay">
    <div class="modal">
      <h3>Redigera kund</h3>
      <input id="ecId" type="hidden">
      <label>Företagsnamn *</label>
      <input id="ecName" type="text">
      <label>Kundnummer</label>
      <input id="ecNr" type="text">
      <label>Adress</label>
      <input id="ecAddress" type="text">
      <label>Postnummer</label>
      <input id="ecZip" type="text">
      <label>Ort *</label>
      <input id="ecCity" type="text">
      <label>Status</label>
      <select id="ecStatus">
        <option value="active">Aktiv</option>
        <option value="prospect">Prospekt</option>
        <option value="inactive">Inaktiv</option>
      </select>
      <label data-role="admin" style="display:none;">Tilldela säljare</label>
      <select id="ecAssign" data-role="admin" style="display:none;"></select>
      <p id="ecError" style="color:#c0392b;font-size:12px;display:none;"></p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="CRM.closeEditCustomer()">Avbryt</button>
        <button class="btn-save" onclick="CRM.saveEditCustomer()">Spara</button>
      </div>
    </div>
  </div>

  <!-- ═══ ADMIN PANEL MODAL ═══ -->
  <div id="adminModal" class="modal-overlay">
    <div class="modal" style="width:560px;max-width:95%;">
      <h3>Administration</h3>
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="users" onclick="CRM.adminTab('users')">Användare</button>
        <button class="admin-tab" data-tab="reassign" onclick="CRM.adminTab('reassign')">Flytta kunder</button>
      </div>

      <!-- Users tab -->
      <div id="adminUsersTab" class="admin-tab-content">
        <div id="adminUsersList"></div>
      </div>

      <!-- Reassign tab -->
      <div id="adminReassignTab" class="admin-tab-content" style="display:none;">
        <div style="display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
          <div style="flex:1;min-width:140px;">
            <label>Från säljare</label>
            <select id="reassignFrom" class="sp-filter-select"></select>
          </div>
          <div style="flex:1;min-width:140px;">
            <label>Till säljare</label>
            <select id="reassignTo" class="sp-filter-select"></select>
          </div>
        </div>
        <div id="reassignList" style="max-height:300px;overflow-y:auto;margin-bottom:12px;"></div>
        <div class="modal-buttons">
          <button class="btn-save" onclick="CRM.executeReassign()">Flytta valda</button>
        </div>
      </div>

      <div class="modal-buttons" style="margin-top:16px;">
        <button class="btn-cancel" onclick="CRM.closeAdmin()">Stäng</button>
      </div>
    </div>
  </div>

  <!-- ═══ ROUTE PLANNER PANEL ═══ -->
  <div id="routePanel" class="route-panel" style="display:none;">
    <div class="route-panel-header">
      <h3>Ruttplanerare</h3>
      <button class="filter-clear-btn" onclick="CRM.closeRoutePanel()">&#x2715;</button>
    </div>
    <p style="font-size:11px;color:var(--bm);margin-bottom:10px;">Välj kunder att besöka. Klicka på markörer i kartan eller välj nedan.</p>
    <input type="text" id="routeSearch" class="card-input" placeholder="Sök kund att lägga till..." style="margin-bottom:10px;">
    <div id="routeSearchResults" style="max-height:120px;overflow-y:auto;margin-bottom:10px;"></div>
    <h4 style="font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--bm);margin-bottom:6px;">Valda stopp (<span id="routeCount">0</span>)</h4>
    <div id="routeStops" style="max-height:200px;overflow-y:auto;margin-bottom:12px;"></div>
    <div style="display:flex;gap:8px;">
      <button class="card-action-btn" onclick="CRM.optimizeRoute()" style="flex:1;">Optimera &amp; öppna</button>
      <button class="card-add-btn" onclick="CRM.clearRoute()">Rensa</button>
    </div>
  </div>

  <!-- ═══ APP SCRIPT ═══ -->
  <script type="module" src="js/app.js"></script>

  <!-- PWA: register service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
